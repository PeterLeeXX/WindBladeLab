[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windbladelab"
version = "0.1.0"
description = "Offline wind turbine inspection planning"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
